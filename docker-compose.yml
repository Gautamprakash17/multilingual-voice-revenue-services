services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revenue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenue}
      POSTGRES_DB: ${POSTGRES_DB:-revenue_poc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host — backend reaches Postgres on the internal network only.
    # For local (non-Docker) backend work, run a separate Postgres or temporarily map 5433:5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenue} -d ${POSTGRES_DB:-revenue_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-revenue}:${POSTGRES_PASSWORD:-revenue}@postgres:5432/${POSTGRES_DB:-revenue_poc}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROVIDER_MODE: ${PROVIDER_MODE:-local}
      CLOUD_AI_ENABLED: ${CLOUD_AI_ENABLED:-false}
      BOUNDARY_POLICY_PATH: /app/config/boundary/policies.yaml
      DOCUMENT_STORAGE_PATH: /app/data/documents
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - document_data:/app/data/documents
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  document_data:

networks:
  internal:
    driver: bridge

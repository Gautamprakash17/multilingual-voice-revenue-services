# Local-first provider topology for the POC.
# Cloud AI is disabled. Restricted data is never sent to cloud providers.
# Runtime wiring: get_stt_provider / get_tts_provider / get_nlu_provider
# with PROVIDER_MODE=local and CLOUD_AI_ENABLED=false; cloud paths remain
# gated by the Data Boundary Gateway.

version: "1"

default_mode: local

providers:
  stt:
    local: faster-whisper
    cloud: null
  tts:
    local: espeak-ng
    cloud: null
  nlu:
    local: rules
    cloud: null

cloud_ai:
  enabled: false

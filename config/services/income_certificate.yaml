service_code: INCOME_CERTIFICATE
display_name: Income Certificate
description: >
  Apply for an Income Certificate through a guided conversational journey.
  POC service definition — rules are declarative and executed by the validation engine.

languages:
  - en
  - hi
  - kn

selection:
  display_names:
    hi: आय प्रमाणपत्र
    kn: ಆದಾಯ ಪ್ರಮಾಣಪತ್ರ
  aliases:
    en:
      - income certificate
    hi:
      - आय प्रमाण पत्र
      - आय प्रमाणपत्र
    kn:
      - ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ
      - ಆದಾಯ ಪ್ರಮಾಣಪತ್ರ
  spoken_phrases:
    en:
      - apply for income certificate
      - I want an income certificate
      - I would like to apply for an income certificate
    hi:
      - आय प्रमाण पत्र के लिए आवेदन करना है
      - मैं आय प्रमाण पत्र के लिए आवेदन करना चाहता हूँ
    kn:
      - ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರಕ್ಕೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಬೇಕು

fields:
  - name: applicant_name
    type: string
    required: true
    prompt: "What is your full name?"
    validation:
      min_length: 2
      max_length: 120

  - name: date_of_birth
    type: date
    required: true
    prompt: "What is your date of birth? (DD/MM/YYYY)"
    validation:
      format: "%d/%m/%Y"

  - name: mobile_number
    type: mobile
    required: true
    prompt: "What is your mobile number? (10 digits)"
    validation:
      pattern: "^[6-9]\\d{9}$"

  - name: address
    type: string
    required: true
    prompt: "What is your residential address?"
    validation:
      min_length: 5
      max_length: 300

  - name: district
    type: string
    required: true
    prompt: "Which district do you live in?"
    validation:
      min_length: 2
      max_length: 80

  - name: annual_income
    type: number
    required: true
    prompt: "What is your annual income in INR? (numbers only)"
    validation:
      min: 0
      max: 100000000

  - name: income_source
    type: string
    required: true
    prompt: "What is your primary source of income?"
    validation:
      min_length: 2
      max_length: 120

documents:
  - code: IDENTITY_PROOF
    required: true
    label: Identity proof
    accepted_types:
      - code: AADHAAR
        label: Aadhaar
      - code: PAN
        label: PAN
      - code: DRIVING_LICENSE
        label: Driving Licence
    allowed_mime_types:
      - application/pdf
      - image/jpeg
      - image/png
    max_size_bytes: 5242880

  - code: ADDRESS_PROOF
    required: true
    label: Address proof
    accepted_types:
      - code: AADHAAR
        label: Aadhaar
      - code: DRIVING_LICENSE
        label: Driving Licence
    allowed_mime_types:
      - application/pdf
      - image/jpeg
      - image/png
    max_size_bytes: 5242880

  - code: INCOME_PROOF
    required: true
    label: Income proof
    accepted_types:
      - code: SALARY_SLIP
        label: Salary slip
      - code: BANK_STATEMENT
        label: Bank statement
      - code: ITR
        label: ITR
    allowed_mime_types:
      - application/pdf
      - image/jpeg
      - image/png
    max_size_bytes: 5242880

fee:
  amount_paise: 5000
  currency: INR
  description: "Application processing fee for Income Certificate"

prompts:
  language_select: "Please choose a language: en, hi, or kn."
  consent: >
    I agree to provide my information for processing this certificate application.
    Please say yes to continue or no to decline.
  service_select: "Available service: Income Certificate. Say Income Certificate to continue, or choose it on screen."
  review_intro: "Please review your application. Say yes to continue to payment, or say change to edit a detail."
  fee_quote: "The application fee is {amount} {currency}. Say yes to pay now, or say change to edit your details."
  payment_prompt: "Please confirm the payment. Say yes to complete the payment, or say cancel to go back."
  payment_failed: "The payment did not go through. Say yes to try again, or say cancel to go back."
  escalate: "Your application has been escalated to an officer. Quote your application ID for follow-up."
  submitted: "Your Income Certificate application has been submitted."

# Fundamental spoken-digit vocabulary for mobile normalization.
# The parser composes these tokens with generic rules (repetition, fillers).
# Do NOT add complete spoken phrases here — only atomic number words,
# repetition markers, and minimal fillers.

number_words:
  # English
  zero: "0"
  oh: "0"
  o: "0"
  one: "1"
  two: "2"
  three: "3"
  four: "4"
  five: "5"
  six: "6"
  seven: "7"
  eight: "8"
  nine: "9"
  # Devanagari digits
  "०": "0"
  "१": "1"
  "२": "2"
  "३": "3"
  "४": "4"
  "५": "5"
  "६": "6"
  "७": "7"
  "८": "8"
  "९": "9"
  # Kannada digits
  "೦": "0"
  "೧": "1"
  "೨": "2"
  "೩": "3"
  "೪": "4"
  "೫": "5"
  "೬": "6"
  "೭": "7"
  "೮": "8"
  "೯": "9"
  # Hindi (Devanagari words)
  "शून्य": "0"
  "एक": "1"
  "दो": "2"
  "तीन": "3"
  "चार": "4"
  "पांच": "5"
  "पाँच": "5"
  "छह": "6"
  "सात": "7"
  "आठ": "8"
  "नौ": "9"
  # Kannada
  "ಸೊನ್ನೆ": "0"
  "ಜೀರೋ": "0"
  "ಒಂದು": "1"
  "ಎರಡು": "2"
  "ಮೂರು": "3"
  "ನಾಲ್ಕು": "4"
  "ಐದು": "5"
  "ಆರು": "6"
  "ಏಳು": "7"
  "ಎಂಟು": "8"
  "ಒಂಬತ್ತು": "9"

filler_words:
  - and
  - the
  - whole
  - number
  - mobile
  - phone
  - digit
  - digits
  - my
  - is
  - registered
  - say
  - please
  - your

# Repetition markers — generic rules apply: <marker> <digit> → digit repeated N times
repetitions:
  - count: 2
    markers:
      - double
      - duble
      - "डबल"
      - "दो बार"
      - "ಎರಡು ಬಾರಿ"
  - count: 3
    markers:
      - triple
      - "ट्रिपल"
      - "तीन बार"
      - "ಮೂರು ಬಾರಿ"

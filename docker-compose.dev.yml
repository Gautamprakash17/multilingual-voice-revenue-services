# Development overrides — bind mounts + live reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or:    ./scripts/dev up
#
# Production demo stack is unchanged: docker compose up --build -d

services:
  backend:
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/alembic.ini:/app/backend/alembic.ini
      - ./config:/app/config
      - document_data:/app/data/documents
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/app --reload-dir /app/config --reload-include '*.yaml' --reload-include '*.yml' --reload-include '*.py'",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports: !override
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_HMR_CLIENT_PORT: "5174"
      # Reliable file watching inside containers (esp. on Docker Desktop / some FS setups).
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Keep container node_modules; sync package.json changes with: ./scripts/dev rebuild frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  frontend_node_modules:
